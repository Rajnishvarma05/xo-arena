<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XO Arena Multiplayer</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 0%,#26375f,#0b1020 55%);color:#f5f7ff;font:16px system-ui}main{width:min(100%,700px)}header{text-align:center}h1{font-size:3rem;margin:0;letter-spacing:-.06em}h1 span{color:#91a2ff}p{color:#b7c1dc}.panel{background:#151e34;border:1px solid #34415f;border-radius:22px;padding:20px;box-shadow:0 20px 60px #0006}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.control{background:#0e1629;border:1px solid #34415f;border-radius:14px;padding:14px}label{display:block;color:#b7c1dc;font-size:.8rem;margin-bottom:8px}input{width:100%;padding:12px;border-radius:9px;border:1px solid #34415f;background:#080e1c;color:white;font:inherit}button{padding:11px 15px;border:0;border-radius:10px;background:#91a2ff;color:#11182d;font-weight:700;cursor:pointer;margin-top:8px}button.secondary{background:#303d5c;color:white}button:disabled{opacity:.4;cursor:not-allowed}.status{text-align:center;background:#0e1629;border:1px solid #34415f;border-radius:12px;padding:13px;margin:15px 0;color:#dbe2ff}.score{display:flex;gap:10px}.player{flex:1;text-align:center;background:#0e1629;border:1px solid #34415f;border-radius:12px;padding:10px;color:#b7c1dc}.player b{display:block;font-size:1.4rem;color:white}.board{width:min(100%,380px);margin:18px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.cell{aspect-ratio:1;margin:0;padding:0;background:#0e1629;border:1px solid #34415f;border-radius:15px;color:white;font-size:clamp(2.7rem,12vw,4.5rem);font-weight:800}.cell.x{color:#7dd3fc}.cell.o{color:#f9a8d4}.actions{text-align:center}.hint{text-align:center;font-size:.85rem;color:#aab5d0}.hidden{display:none}@media(max-width:540px){.controls{grid-template-columns:1fr}.panel{padding:14px}}
</style></head><body><main><header><h1>XO <span>ARENA</span></h1><p>Two players. One board. May the best strategist win.</p></header>
<section class="panel"><div class="controls">
<div class="control"><label>CREATE A ROOM · YOU PLAY X</label><button id="create">Create room</button><div id="roomInfo" class="hidden"><p>Share this room code:</p><input id="roomCode" readonly><button class="secondary" id="copy">Copy code</button></div></div>
<div class="control"><label>JOIN A ROOM · YOU PLAY O</label><input id="joinCode" placeholder="Enter room code"><button id="join">Join game</button></div></div>
<div class="status" id="status" aria-live="polite">Create a room or join a friend's room to start.</div>
<div class="score"><div class="player">PLAYER X<b id="scoreX">0</b></div><div class="player">DRAWS<b id="scoreD">0</b></div><div class="player">PLAYER O<b id="scoreO">0</b></div></div>
<div class="board"><button class="cell" data-i="0"></button><button class="cell" data-i="1"></button><button class="cell" data-i="2"></button><button class="cell" data-i="3"></button><button class="cell" data-i="4"></button><button class="cell" data-i="5"></button><button class="cell" data-i="6"></button><button class="cell" data-i="7"></button><button class="cell" data-i="8"></button></div>
<div class="actions"><button id="restart" class="secondary" disabled>New round</button> <button id="leave" class="secondary" disabled>Leave game</button></div><p class="hint">Open this page on two devices. One creates a room; the other joins with the code.</p></section>
<p class="hint">XO Arena · Handshake Multiplayer Game Challenge</p></main>
<script>
(()=>{const $=id=>document.getElementById(id),cells=[...document.querySelectorAll('.cell')],wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let peer=null,conn=null,role=null,board=Array(9).fill(''),turn='X',active=false,scores={X:0,O:0,D:0};
const say=t=>$('status').textContent=t, result=()=>{let w=wins.find(a=>a.every(i=>board[i]&&board[i]===board[a[0]]));return w?board[w[0]]:board.every(Boolean)?'D':null};
function paint(){cells.forEach((c,i)=>{c.textContent=board[i];c.className='cell'+(board[i]?' '+board[i].toLowerCase():'');c.disabled=!active||!!board[i]||role!==turn});$('scoreX').textContent=scores.X;$('scoreO').textContent=scores.O;$('scoreD').textContent=scores.D;$('restart').disabled=!(conn&&conn.open)}
function send(){if(conn&&conn.open)conn.send({type:'state',board,turn,active,scores})}
function apply(s){board=s.board;turn=s.turn;active=s.active;scores=s.scores;paint();if(!active){let r=result();say(r==='D'?'Draw!':`Player ${r} wins!`)}else say(turn===role?'Your turn.':'Waiting for opponent…')}
function reset(){board=Array(9).fill('');turn='X';active=true;paint();say('New round! Player X starts.');send()}
function leave(msg){if(conn)conn.close();if(peer)peer.destroy();conn=peer=role=null;active=false;paint();$('leave').disabled=true;$('restart').disabled=true;$('create').disabled=false;say(msg||'You left the game.')}
function connect(c){conn=c;c.on('open',()=>{$('leave').disabled=false;active=true;paint();say(role==='X'?'Room ready. Share the code; you are X.':'Connected! You are O.');if(role==='X')send()});c.on('data',d=>{if(d.type==='move'&&role==='X'&&active&&d.i>=0&&d.i<9&&!board[d.i]&&turn==='O'){board[d.i]='O';let r=result();if(r){active=false;scores[r]++}else turn='X';paint();send();if(!active)say(r==='D'?'Draw!':'Player O wins!');else say('Your turn.')}else if(d.type==='state'&&role==='O')apply(d);else if(d.type==='restart'&&role==='X')reset()});c.on('close',()=>leave('Opponent disconnected. Start a new room.'));c.on('error',()=>say('Connection problem. Check the room code.'))}
$('create').onclick=()=>{if(!window.Peer){say('Multiplayer service did not load. Refresh and try again.');return}leave('Creating room…');role='X';peer=new Peer();peer.on('open',id=>{$('roomInfo').classList.remove('hidden');$('roomCode').value=id;$('create').disabled=true;say('Room created. Share the code and wait for Player O.')});peer.on('connection',c=>{if(conn)c.close();else connect(c)});peer.on('error',e=>{say('Could not create room: '+e.type);$('create').disabled=false})};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('roomCode').value);$('copy').textContent='Copied!'}catch(e){$('roomCode').select();say('Select and copy the room code.')}};
$('join').onclick=()=>{let id=$('joinCode').value.trim();if(!id){say('Enter a room code.');return}if(!window.Peer){say('Multiplayer service did not load. Refresh and try again.');return}leave('Connecting…');role='O';peer=new Peer();peer.on('open',()=>connect(peer.connect(id,{reliable:true})));peer.on('error',e=>say('Could not connect: '+e.type+'. Check the code.'))};
cells.forEach(c=>c.onclick=()=>{let i=+c.dataset.i;if(!active||board[i]||role!==turn)return;if(role==='X'){board[i]='X';let r=result();if(r){active=false;scores[r]++}else turn='O';paint();send();if(!active)say(r==='D'?'Draw!':'Player X wins!');else say('Waiting for opponent…')}else if(conn&&conn.open){conn.send({type:'move',i});say('Move sent…')}});
$('restart').onclick=()=>{if(role==='X')reset();else if(conn&&conn.open){conn.send({type:'restart'});say('Restart request sent to Player X.')}};$('leave').onclick=()=>leave();paint()})();
</script></body></html>
